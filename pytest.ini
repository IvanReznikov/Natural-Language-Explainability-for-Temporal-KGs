# Test Configuration

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show summary of all test outcomes
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src/temporal_nlg
    --cov=src/temporal_nlg_metta
    --cov-report=html
    --cov-report=term-missing

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests

filterwarnings =
    # Third-party (pydantic v1/langsmith) warning on Python 3.13+ during import.
    ignore:Failing to pass a value to the 'type_params' parameter of 'typing.ForwardRef\._evaluate' is deprecated.*:DeprecationWarning
    # Third-party textstat warning from pkg_resources deprecation.
    ignore:pkg_resources is deprecated as an API.*:UserWarning
    
# Coverage settings
[coverage:run]
source = src/temporal_nlg
    src/temporal_nlg_metta
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:

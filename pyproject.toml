[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-nlg"
version = "0.1.0"
description = "Temporal relationship verbalization library with template, LLM, and hybrid generation options."
readme = "README.md"
authors = [{ name = "SNET Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "openai>=1.60.0",
  "langchain>=0.3.7",
  "langchain-openai>=0.3.7",
  "langchain-huggingface>=0.1.2",
  "rich>=13.7.1",
  "python-dotenv>=1.0.1",
  "textstat>=0.7.3",
  "pydantic==2.10.5",
  "scikit-learn==1.8.0",
  "sentence-transformers>=2.7.0",
  "transformers>=4.51.0",
  "accelerate>=0.33.0",
  "torch>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.3",
  "pytest-cov>=4.1.0",
  "black>=23.0.0",
  "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://example.com/temporal-nlg"
Repository = "https://example.com/temporal-nlg/repo"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["temporal_nlg*"]

[tool.setuptools.package-data]
temporal_nlg = []

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
